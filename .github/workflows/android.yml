name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq build-essential cmake libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev libibus-1.0-dev libdbus-1-dev libdecor-0-dev libudev-dev libgbm-dev libdrm-dev libwayland-dev libpng-dev libturbojpeg-dev libvorbis-dev libopenal-dev libsdl2-dev libmbedtls-dev libuv1-dev libx11-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxss-dev libpulse-dev libasound2-dev libpipewire-0.3-dev

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install hmm --quiet
          haxelib run hmm install --quiet
          haxelib install format --quiet

      - name: Get Lime source with submodules
        run: |
          git clone --recursive https://github.com/GreenColdTea/lime-fc.git $HOME/lime
          cd $HOME/lime/project/lib/sdl_image
          git submodule update --init --recursive --force
          haxelib dev lime $HOME/lime

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME -nocffi
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }} -nocffi
          haxelib run lime config JAVA_HOME $JAVA_HOME -nocffi
          haxelib run lime config ANDROID_SETUP true -nocffi

      - name: Rebuild Lime native libraries
        timeout-minutes: 90
        run: |
          rm -rf $HOME/lime/ndll
          mkdir $HOME/lime/ndll
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild linux -64 -release
          haxelib run lime rebuild android -arm64 -release

      - name: Build APK
        timeout-minutes: 240
        run: haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: export/**/*.apk

      - name: Upload contents and assets
        uses: actions/upload-artifact@v4
        with:
          name: mobile-contents
          path: export/mobile-contents
