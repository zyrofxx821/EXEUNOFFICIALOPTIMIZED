name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libavif16 libjxl0.7 libwebp7 libpng16-16 libjpeg-turbo8
          sudo apt-get install -y build-essential libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libxss-dev libdrm-dev libgbm-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev

      - name: Rebuild Lime native library
        run: haxelib run lime rebuild linux -release

      - name: Configure Lime for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Build APK
        run: haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: export/**/*.apk

      - name: Upload contents and assets
        uses: actions/upload-artifact@v4
        with:
          name: mobile-contents
          path: export/mobile-contents
